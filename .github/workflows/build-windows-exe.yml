name: Build Windows Executable

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.2). Leave empty to only upload artifact.'
        required: false
        default: ''
      create_release:
        description: 'Create a GitHub Release with the exe?'
        type: boolean
        required: false
        default: false

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller PyQt6 PyYAML numpy scipy soundfile `
            webrtcvad pynput PyAudio cffi faster-whisper==1.0.3 "setuptools<81"

      - name: Build Windows executable
        shell: pwsh
        run: |
          python -m PyInstaller `
            --onefile `
            --windowed `
            --name WhisperWriter `
            --icon assets/ww-logo.ico `
            --paths src `
            --add-data "assets;assets" `
            --add-data "src/config_schema.yaml;." `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all tokenizers `
            --collect-all onnxruntime `
            --collect-all pkg_resources `
            --collect-all huggingface_hub `
            --hidden-import pkg_resources `
            src/main.py

      - name: Verify build
        shell: pwsh
        run: |
          if (Test-Path "dist/WhisperWriter.exe") {
            $size = (Get-Item "dist/WhisperWriter.exe").Length / 1MB
            Write-Host ("[SUCCESS] dist/WhisperWriter.exe ({0:N1} MB)" -f $size)
          } else {
            throw "Build failed - no exe in dist/"
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperWriter-windows
          path: dist/WhisperWriter.exe
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: ${{ github.event.inputs.create_release == 'true' && github.event.inputs.tag_name != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name }}
          name: WhisperWriter ${{ github.event.inputs.tag_name }}
          body: |
            Portable Windows executable for WhisperWriter.

            - Single .exe file, no Python installation required
            - Includes Faster Whisper backend (download model on first run)
            - Real-time speech-to-text to any active window
          draft: true
          files: dist/WhisperWriter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
